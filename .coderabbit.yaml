# 제출 시점에 변경분을 보는 판정 주체.
# 시점은 준비 완료 전환 1회, 권한은 의견까지다.
#
# 이 레포의 산출물은 스크립트와 **모델이 읽고 실행하는 지시문**(skills·providers·docs)이다.
# 그래서 마크다운을 검토 대상에서 빼지 않는다. 사람이 읽는 기획·설계 산문과 달리
# 여기의 마크다운은 실행되는 것이고, 링크·절차 순서가 어긋나면 그대로 결함이다.
# 빼는 것은 기계가 생성하는 파일뿐이다.
# 무엇을 지시할지(path_instructions)와 무엇을 막을지(pre_merge_checks)는
# 실제로 어떤 지적이 오는지 본 뒤에 더한다. 짐작으로 미리 적지 않는다.
language: ko-KR

reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false                   # 초안은 건너뛴다. 작성자가 먼저 읽는 구간이다
    auto_incremental_review: false  # 전환 시 1회. 이후 푸시는 재검토하지 않는다
  path_filters:
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!CHANGELOG.md"          # bump-version.sh 가 생성한다. 사람이 고칠 자리가 아니다
