name: Auto Release

on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

# step output 은 run 블록에 expression 으로 넣지 않는다. 셸 실행 전에 문자열로 치환되어
# VERSION · CHANGELOG(머지된 PR 이 바꾸는 값) 안의 셸 문법이 그대로 실행된다. env 로 넘긴다.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        if: steps.check.outputs.exists == 'false'
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract section for this version from CHANGELOG.md
          BODY=$(awk -v ver="$VERSION" 'index($0, "## [" ver "]") == 1 {found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release v$VERSION"
          fi
          # Use delimiter for multiline output
          echo "body<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"

      - name: Sync marketplace.json version
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            sed -i'' -e "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" .claude-plugin/marketplace.json
            if git diff --quiet .claude-plugin/marketplace.json; then
              echo "marketplace.json already up to date"
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add .claude-plugin/marketplace.json
              git commit -m "chore: marketplace.json version sync to $VERSION [skip ci]"
              git push origin main
            fi
          fi

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$BODY"
