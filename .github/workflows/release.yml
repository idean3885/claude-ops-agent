name: Auto Release

# 머지가 곧 릴리즈다 (ADR-0040). 사람의 판정은 PR 머지 한 번이고, 버전 선택 · 끊기 ·
# 태그 · 릴리즈 노트는 이 잡이 한다. 릴리즈 PR 을 따로 두지 않는다.
on:
  push:
    branches: [main]

permissions:
  contents: write

# 연달아 머지되면 앞 잡이 끝난 뒤 다음 잡이 최신 main 에서 다시 판단한다.
# 앞 잡이 Unreleased 를 끊었으면 다음 잡은 끊을 것이 없어 멈춘다.
concurrency:
  group: auto-release
  cancel-in-progress: false

# step output 은 run 블록에 expression 으로 넣지 않는다. 셸 실행 전에 문자열로 치환되어
# VERSION · CHANGELOG(머지된 PR 이 바꾸는 값) 안의 셸 문법이 그대로 실행된다. env 로 넘긴다.
# 이 잡의 push 는 잡 토큰(github.token)으로 하므로 워크플로를 다시 띄우지 않는다.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide version
        id: version
        run: |
          NEXT=$(./scripts/bump-version.sh next)
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          # 끊을 것이 없어도 VERSION 을 손으로 올린 머지(이 규칙 이전의 릴리즈 PR)는 태그가 없을 수 있다.
          TAGVER=${NEXT:-$(tr -d '[:space:]' < VERSION)}
          echo "tagver=$TAGVER" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v$TAGVER" | grep -q .; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cut release
        id: cut
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          ./scripts/bump-version.sh release "$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore: release $NEXT"
          # 잡이 도는 사이 다른 머지가 들어오면 push 가 거부된다. 그 머지의 잡이 함께 끊으므로 여기서는 멈추고 성공으로 끝낸다.
          if git push origin HEAD:main; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "main 이 앞서 나가 다음 잡에 넘긴다"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        if: steps.version.outputs.publish == 'true' && (steps.version.outputs.next == '' || steps.cut.outputs.pushed == 'true')
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.tagver }}
        run: |
          BODY=$(awk -v ver="$VERSION" 'index($0, "## [" ver "]") == 1 {found=1; next} /^## \[/{if(found) exit} found{print}' CHANGELOG.md)
          [ -n "$BODY" ] || BODY="Release v$VERSION"
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.version.outputs.publish == 'true' && (steps.version.outputs.next == '' || steps.cut.outputs.pushed == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.tagver }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$BODY"
